<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Calculadora RTC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-acesso">
  <main class="acesso">
    <div class="marca marca-acesso">
      <span class="marca-icone" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 4h14v16H5z M8 8h8 M8 12h3 M13 12h3 M8 16h3 M13 16h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <strong>Calculadora RTC</strong>
        <small>CBS, IBS e Imposto Seletivo</small>
      </div>
    </div>

    <section class="cartao-acesso">
      <div class="abas" role="tablist">
        <button role="tab" aria-selected="true" data-aba="entrar">Entrar</button>
        <button role="tab" aria-selected="false" data-aba="cadastro">Criar conta</button>
      </div>

      <p class="aviso-convite" id="aviso-convite" hidden></p>

      <form id="form-entrar" novalidate>
        <label class="campo">E-mail<input name="email" type="email" autocomplete="email" required></label>
        <label class="campo">Senha<input name="senha" type="password" autocomplete="current-password" required></label>
        <ul class="erros" hidden></ul>
        <button class="botao primario largo" type="submit">Entrar</button>
      </form>

      <form id="form-cadastro" novalidate hidden>
        <fieldset class="escolha-tipo">
          <legend>Você é</legend>
          <label class="opcao">
            <input type="radio" name="tipo" value="contador" checked>
            <span><strong>Contador</strong><small>Atendo várias empresas</small></span>
          </label>
          <label class="opcao">
            <input type="radio" name="tipo" value="empresa">
            <span><strong>Empresa</strong><small>Quero calcular o meu imposto</small></span>
          </label>
        </fieldset>
        <label class="campo">Seu nome<input name="nome" autocomplete="name" required></label>
        <label class="campo">E-mail<input name="email" type="email" autocomplete="email" required></label>
        <label class="campo">Senha<input name="senha" type="password" autocomplete="new-password" minlength="8" required placeholder="Pelo menos 8 caracteres"></label>
        <ul class="erros" hidden></ul>
        <button class="botao primario largo" type="submit">Criar conta</button>
      </form>
    </section>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
